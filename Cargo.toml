[package]
name = "zk-proof-performance-laboratory"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Reproducible Groth16 proving, verification, and proof-size benchmarks"
license = "MIT"

[dependencies]
ark-bls12-381 = { version = "0.6.0", features = ["curve", "std"] }
ark-ec = { version = "0.6.0", features = ["std"] }
ark-ff = { version = "0.6.0", features = ["std"] }
ark-groth16 = { version = "0.6.0", features = ["std"] }
ark-relations = { version = "0.6.0", features = ["std"] }
ark-serialize = { version = "0.6.0", features = ["std"] }
ark-snark = "0.6.0"
ark-std = { version = "0.6.0", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "groth16"
harness = false
